spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/social_network
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: super

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
server:
  port: 8080

myapp:
  app:
    jwtSecret: superSecretKeyThatIsAtLeast256BitsLongAndShouldBeChangedInProduction
    jwtExpirationMs: 86400000 # 24 hours
